# web/ 폴더를 GitHub Pages(고정 주소)로 배포
#   https://uyeonim.github.io/go2-pro-dashboard/
# 노트북 대시보드가 켜져 있으면 실제 화면으로 이동하고, 꺼져 있으면 브라우저 데모를 보여줌
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
